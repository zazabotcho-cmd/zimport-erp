<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WINGLOBAL Winery Portal</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ef;color:#272127;font:16px system-ui}header{background:#3d1730;color:#fff;padding:24px max(5vw,20px);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}header h1{margin:0;font-size:24px}main{max-width:1120px;margin:24px auto;padding:0 20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}article,form{background:white;border:1px solid #e0d8dc;border-radius:12px;padding:20px;margin:12px 0}button{background:#70254c;color:white;border:0;border-radius:7px;padding:9px 13px;margin:3px;cursor:pointer}button:disabled{opacity:.5;cursor:default}label{display:block;font-size:14px}input,select,textarea{width:100%;margin:5px 0 10px;padding:8px;border:1px solid #c9bec5;border-radius:5px;font:inherit}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:10px}.full{grid-column:1/-1}.hidden{display:none}.note,small{color:#695863}header small{color:#f2dbe7}fieldset{border:0;padding:0}summary{cursor:pointer}a{color:#70254c}
.badge{background:#b41429;color:white;border-radius:12px;padding:2px 7px;margin-left:5px;font-weight:700}.supplier-actions{display:flex;gap:8px;flex-wrap:wrap;border-inline-start:1px solid #9d8793;padding-inline-start:10px;margin-inline-start:auto}#quoteTransportCostRow{font-size:12px}#quoteTransportCost{display:block;width:8rem;max-width:100%;padding:4px 6px}.submission-details-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.submission-details-row>label{display:flex;flex-direction:column}.submission-details-row input,.submission-details-row textarea{margin-top:auto}@media(max-width:720px){.submission-details-row{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:420px){.submission-details-row{grid-template-columns:1fr}}.italy-score-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.italy-score-row>label{display:flex;flex-direction:column}.italy-score-row input,.italy-score-row select{margin-top:auto}@media(max-width:600px){.italy-score-row{grid-template-columns:1fr}}.tender-identification-row>div{display:flex;flex-direction:column;min-width:0}.tender-identification-row>div>label:first-child{display:flex;flex-direction:column;flex:1}.tender-identification-row>div>label:first-child input{margin-top:auto}</style>
<header><div><h1>WINGLOBAL Winery Portal</h1><small>Local prototype · use sample information only</small></div><select id="role" style="width:auto" aria-label="Preview as"></select></header>
<main><nav id="nav"></nav><section id="view"></section></main><script src="portal.js" defer></script></html>
